<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AMAC: bolsa de trabajo para adultos mayores.">
  <title>Iniciar sesión | AMAC</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&amp;family=Work+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
</head>
<body>
  <a class="saltar-contenido" href="#principal">Saltar al contenido</a>
  <header class="encabezado">
    <div class="contenedor encabezado__interior">
      <a class="logo" href="index.html"><img class="logo__imagen" src="img/logo.svg" alt="" width="40" height="20"><span>AMAC</span></a>
      <nav class="nav-principal" aria-label="Navegación principal">
        <ul class="nav-principal__lista">
          <li><a class="nav-principal__enlace" href="index.html">Trabajos</a></li><li><a class="nav-principal__enlace" href="mis-solicitudes.html">Mis solicitudes</a></li><li><a class="nav-principal__enlace" href="login.html" aria-current="page"><svg class="icono" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Iniciar sesión</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="principal">
    <div class="contenedor contenedor--angosto">
      <section class="tarjeta pila" aria-labelledby="titulo-login">
        <header class="texto-centro">
          <h1 id="titulo-login">Bienvenido a AMAC</h1>
          <p class="texto-suave">Envejecer es vivir</p>
        </header>
        <form class="formulario" id="form-login" action="index.html" method="get">
          <fieldset class="selector-rol">
            <legend class="solo-lector">Elige tu rol</legend>
            <div class="selector-rol__opcion">
              <input type="radio" id="rol-trabajador" name="rol" value="trabajador" required>
              <label for="rol-trabajador"><svg class="icono" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Soy trabajador</label>
            </div>
            <div class="selector-rol__opcion">
              <input type="radio" id="rol-empresa" name="rol" value="empresa">
              <label for="rol-empresa"><svg class="icono" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/></svg> Soy empresa</label>
            </div>
          </fieldset>

          <div class="campo-formulario">
            <label for="correo">Correo electrónico <span class="campo-formulario__obligatorio" aria-hidden="true">*</span></label>
            <input type="email" id="correo" name="correo" placeholder="nombre@correo.com" autocomplete="email" required>
          </div>
          <div class="campo-formulario">
            <label for="contrasena">Contraseña <span class="campo-formulario__obligatorio" aria-hidden="true">*</span></label>
            <input type="password" id="contrasena" placeholder="Escribe tu contraseña" autocomplete="current-password" required>
          </div>

          <p class="texto-centro"><a href="#">Olvidé mi contraseña</a></p>

          <button class="boton boton--marino boton--completo" type="submit">Ingresar</button>
        </form>
        <p class="texto-centro">¿No tienes cuenta? <a id="enlace-crear-cuenta" href="registro-candidato.html">Crear cuenta</a></p>
      </section>
    </div>
    <script src="js/login.js"></script>
  </main>
  <footer class="pie">
    <div class="contenedor pie__interior">
      <p>AMAC · Bolsa de trabajo para adultos mayores</p>
      <p>Envejecer es vivir</p>
    </div>
  </footer>
  <div class="boton-ayuda">
    <a class="boton boton--primario boton--ayuda" href="tel:+528100000000">
      <span><svg class="icono" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg> ¿Necesitas ayuda?</span>
      <small>Llama aquí</small>
    </a>
  </div>
</body>
</html>
